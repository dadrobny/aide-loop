name: release

# Every core/VERSION that reaches main gets a tag v<VERSION> and a GitHub
# Release whose body is that version's CHANGELOG.md section (issue #198). A
# push that moves no version — docs, repo tests, an installer-only change —
# finds both already there and does nothing, which is the bump policy as the
# changelog's "Installer (unversioned)" section states it. The section is
# guaranteed to exist: tests/test_repo_versioning.py refuses a version the
# changelog does not name.

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two merges in quick succession must not race each other to the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release core/VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < core/VERSION)"
          tag="v${version}"

          # The tag and the release are checked separately: a tag that exists
          # without a release (the one-time backfill made tags only) still
          # gets its release, on the commit the tag already names.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} exists"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
            echo "created tag ${tag} at ${GITHUB_SHA}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} exists; nothing to do"
            exit 0
          fi

          # The section runs from its "## [<version>]" heading to the next
          # "## " heading, both exclusive. index() matches the heading
          # literally, so the dots and brackets are not a pattern.
          awk -v head="## [${version}]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [${version}]' section"
            exit 1
          fi

          gh release create "${tag}" --verify-tag --title "${tag}" --notes-file notes.md
