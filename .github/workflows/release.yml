name: release

# Every core/VERSION that reaches main gets an annotated tag v<VERSION> and,
# from RELEASES_FROM on, a GitHub Release whose body is that version's
# CHANGELOG.md section (issue #198). Versions before it are tags only, from a
# one-time backfill.
#
# Each run rebuilds the whole set from main's first-parent history instead of
# reading the pushed commit: a version's tag goes on the first commit where
# core/VERSION held it. So a run that was cancelled (a pending run is replaced
# when a newer one queues in the concurrency group), failed, or covered a push
# of several merges at once is made good by the next run, and a missing tag can
# never land on a later docs-only merge. A push that moves no version finds
# everything present and does nothing, which is the bump policy as the
# changelog's "Installer (unversioned)" section states it.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release every core/VERSION on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_FROM: "1.52.1"
        shell: python
        run: |
          import json, os, re, subprocess, sys

          sys.path.insert(0, os.getcwd())
          # The installer's reading: a BOM or a "-rc.1" suffix orders, never raises.
          from install import parse_version as key

          def run(*args):
              result = subprocess.run(args, capture_output=True, text=True)
              if result.returncode:
                  sys.exit(f"{' '.join(args)} exited {result.returncode}:\n"
                           f"{result.stderr}{result.stdout}")
              return result.stdout

          # First commit, oldest first, where core/VERSION held each value.
          first = {}
          for sha in run("git", "log", "--first-parent", "--reverse",
                         "--format=%H", os.environ["GITHUB_SHA"], "--",
                         "core/VERSION").split():
              shown = subprocess.run(["git", "show", f"{sha}:core/VERSION"],
                                     capture_output=True, text=True)
              if shown.returncode:
                  continue  # the commit that deleted it, if one ever does
              version = shown.stdout.lstrip("\ufeff").strip()
              first.setdefault(version, sha)

          tags = {line.split("refs/tags/", 1)[1]
                  for line in run("git", "ls-remote", "--tags", "origin").splitlines()
                  if not line.endswith("^{}")}
          releases = {r["tagName"] for r in json.loads(run(
              "gh", "release", "list", "--limit", "1000", "--json", "tagName"))}
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          floor = key(os.environ["RELEASES_FROM"])

          # Read every release body before pushing anything. A version with no
          # section (tests/test_repo_versioning.py guarantees one for the
          # version that lands, so this is an intermediate version a
          # rebase-merge left in history) is tagged with a warning and never
          # fails the job: failing would block every later version for good.
          # Adding the section later makes its release on the next run.
          todo = []
          for version, sha in first.items():
              tag = f"v{version}"
              notes = None
              if key(version) >= floor and tag not in releases:
                  # The section runs from its "## [<version>]" heading to the
                  # next "## " heading.
                  match = re.search(
                      rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
                      changelog, re.MULTILINE | re.DOTALL)
                  notes = match.group(1).strip() if match else ""
                  if not notes:
                      print(f"::warning::CHANGELOG.md has no non-empty "
                            f"'## [{version}]' section; tagging {tag} only")
                      notes = None
              if tag not in tags or notes is not None:
                  todo.append((tag, sha, notes))

          if todo:
              run("git", "config", "user.name", "github-actions[bot]")
              run("git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com")
          for tag, sha, notes in todo:
              if tag not in tags:
                  run("git", "tag", "-a", tag, sha, "-m", tag)
                  run("git", "push", "origin", f"refs/tags/{tag}")
                  print(f"created tag {tag} at {sha}")
              if notes is not None:
                  with open("notes.md", "w", encoding="utf-8") as handle:
                      handle.write(notes + "\n")
                  run("gh", "release", "create", tag, "--verify-tag",
                      "--title", tag, "--notes-file", "notes.md")
                  print(f"created release {tag}")
          if not todo:
              print("every version on main is tagged and released; nothing to do")
