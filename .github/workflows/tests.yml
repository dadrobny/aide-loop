name: tests

on:
  push:
    branches: [main]
  # A draft PR runs nothing: pushes while it is a draft are skipped, and
  # marking it ready (ready_for_review) runs the suite on its head. Pushes to
  # a ready PR run as usual; converting it back to draft stops them again.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pytest:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      # Test modules Windows proves nothing about: every Windows job skips
      # them, the ubuntu job runs them. The rule deciding which modules may
      # be here, and each one's reason, are tests/test_ci_shards.py's
      # UBUNTU_ONLY — which fails when this list and that one disagree.
      UBUNTU_ONLY: >-
        --ignore=core/scripts/tests/test_aide_base.py
        --ignore=core/scripts/tests/test_aide_queue_pr.py
        --ignore=core/scripts/tests/test_aide_restack.py
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu runs the whole suite in one job: a bare `pytest`, ~100s of
        # tests (~2 min a job). The suite is mostly process spawning, almost
        # all git, and a spawn costs ~13x more on Windows (issue #74) — the git
        # modules run 8-21x slower there, and the old two-shard split let one
        # Windows job reach ~13 min (issue #358). So the Windows leg skips
        # UBUNTU_ONLY and splits the rest by measured test time (seconds, last
        # green main run before #358): fixture consumer 326; git 103 +
        # merge_inherited 81 + status_stack 75; the rest ~255. Each job adds
        # ~30-60s of setup. "the rest" names every testpaths root, so a new
        # module runs on Windows with no edit here, and --ignores each file a
        # shard above names. tests/test_ci_shards.py pins that every test
        # module runs in exactly one Windows shard, unless it is UBUNTU_ONLY.
        include:
          - os: ubuntu-latest
            shard: whole suite
            tests: ""
          - os: windows-latest
            shard: fixture consumer
            tests: "tests/test_fixture_consumer.py"
          - os: windows-latest
            shard: engine git verbs
            tests: "core/scripts/tests/test_aide_git.py
                    core/scripts/tests/test_aide_merge_inherited.py
                    core/scripts/tests/test_aide_status_stack.py"
          - os: windows-latest
            shard: the rest
            tests: "core adapters tests
                    --ignore=tests/test_fixture_consumer.py
                    --ignore=core/scripts/tests/test_aide_git.py
                    --ignore=core/scripts/tests/test_aide_merge_inherited.py
                    --ignore=core/scripts/tests/test_aide_status_stack.py"
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}) ${{ matrix.shard }}
    steps:
      # The windows-latest image already ships Defender with real-time
      # scanning disabled and C:\ + D:\ excluded (runner-images'
      # Configure-WindowsDefender.ps1), and PR #117's runs measured exactly
      # that: RealTimeProtectionEnabled False, yet still ~55ms per subprocess
      # spawn — the cost is CreateProcess plus the MSYS2 loader, not scanning
      # (issue #74). This step only guards against an image update regressing
      # the disable: it says what it found, re-asserts only when needed, and
      # try/catches so a refused cmdlet reads as a slower job, never a red one.
      - name: Keep Defender real-time scanning off
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          try {
            $before = (Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled
            Write-Host "RealTimeProtectionEnabled on the image: $before"
            if ($before) {
              Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
              $after = (Get-MpComputerStatus).RealTimeProtectionEnabled
              Write-Host "RealTimeProtectionEnabled after disable: $after"
              if ($after) {
                Add-MpPreference -ExclusionProcess "git.exe", "python.exe", "pytest.exe" -ErrorAction Stop
                Write-Host "disable refused; added process exclusions"
              }
            }
          } catch {
            Write-Host "Defender query/config refused: $_"
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pytest
      - run: pytest ${{ matrix.tests }} ${{ runner.os == 'Windows' && env.UBUNTU_ONLY || '' }}
